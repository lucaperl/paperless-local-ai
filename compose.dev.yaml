services:
  ocr-service:
    build:
      context: .
      dockerfile: docker/ocr.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: paperless-local-ai-ocr:dev

  core-service:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: paperless-local-ai-core:dev

  doctor:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: paperless-local-ai-core:dev
