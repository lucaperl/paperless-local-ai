name: paperless-local-ai

x-core-image: &core-image
  image: ${IMAGE_PREFIX:-ghcr.io/lucaperl/paperless-local-ai}-core:${APP_VERSION:-stable}
  restart: unless-stopped

x-core-volumes: &core-volumes
  - ${APP_DATA_DIR:-./data}/config:/config
  - ${APP_DATA_DIR:-./data}/core:/data
  - ${APP_DATA_DIR:-./data}/coordination:/coordination

services:
  ocr-service:
    image: ${IMAGE_PREFIX:-ghcr.io/lucaperl/paperless-local-ai}-ocr:${APP_VERSION:-stable}
    restart: unless-stopped
    environment:
      HOME: /ocr-data
      PADDLE_PDX_CACHE_HOME: /ocr-data/.paddlex
      PADDLE_PDX_CPU_NUM_THREADS: "${PADDLE_PDX_CPU_NUM_THREADS:-4}"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      OCR_SESSION_IDLE_SECONDS: "${OCR_SESSION_IDLE_SECONDS:-5}"
      OCR_ENABLE_HPI: "${OCR_ENABLE_HPI:-true}"
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:?set OCR_SERVICE_TOKEN in .env}
      OCR_SERVICE_HOST: 0.0.0.0
      OCR_SERVICE_PORT: "8082"
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-1800}
      OCR_MAX_REQUEST_BYTES: ${OCR_MAX_REQUEST_BYTES:-104857600}
      OCR_TMP_DIR: ${OCR_TMP_DIR:-/dev/shm/paperless-local-ai-ocr}
    ports:
      - ${OCR_SERVICE_BIND:-127.0.0.1}:${OCR_SERVICE_PORT:-30150}:8082
    volumes:
      - ${APP_DATA_DIR:-./data}/config:/config:ro
      - ${APP_DATA_DIR:-./data}/ocr:/ocr-data
      - ${APP_DATA_DIR:-./data}/coordination:/coordination
      - ${APP_DATA_DIR:-./data}/integration:/integration
    mem_limit: ${OCR_MEMORY_LIMIT:-7g}
    cpus: ${OCR_CPU_LIMIT:-4.0}
    shm_size: ${OCR_SHM_SIZE:-2gb}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  core-service:
    <<: *core-image
    command: ["/usr/local/bin/plai-core"]
    environment:
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:?set PAPERLESS_TOKEN in .env}
      PROMPT_UI_HOST: 0.0.0.0
      PROMPT_UI_PORT: "8080"
      SUGGESTION_BRIDGE_HOST: 0.0.0.0
      SUGGESTION_BRIDGE_PORT: "8081"
    ports:
      - ${PROMPT_UI_BIND:-127.0.0.1}:${PROMPT_UI_PORT:-30148}:8080
      - ${SUGGESTION_BRIDGE_BIND:-127.0.0.1}:${SUGGESTION_BRIDGE_PORT:-30149}:8081
    volumes: *core-volumes
    mem_limit: ${CORE_MEMORY_LIMIT:-512m}
    cpus: ${CORE_CPU_LIMIT:-0.5}
    healthcheck:
      test: ["CMD", "/usr/local/bin/plai-core", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  doctor:
    profiles: ["tools"]
    <<: *core-image
    restart: "no"
    command: ["python", "/app/doctor.py"]
    environment:
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:?set PAPERLESS_TOKEN in .env}
    volumes:
      - ${APP_DATA_DIR:-./data}/config:/config:ro
      - ${APP_DATA_DIR:-./data}/core:/data:ro
