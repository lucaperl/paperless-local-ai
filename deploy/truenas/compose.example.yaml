name: paperless-local-ai

x-core-image: &core-image
  image: ghcr.io/lucaperl/paperless-local-ai-core:stable
  restart: unless-stopped

x-core-volumes: &core-volumes
  - /mnt/YOUR_POOL/paperless-local-ai/config:/config
  - /mnt/YOUR_POOL/paperless-local-ai/core:/data
  - /mnt/YOUR_POOL/paperless-local-ai/coordination:/coordination

services:
  ocr-worker:
    image: ghcr.io/lucaperl/paperless-local-ai-ocr:stable
    restart: unless-stopped
    env_file:
      - /mnt/YOUR_POOL/paperless-local-ai/paperless.env
    environment:
      HOME: /ocr-data
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    volumes:
      - /mnt/YOUR_POOL/paperless-local-ai/config:/config:ro
      - /mnt/YOUR_POOL/paperless-local-ai/ocr:/ocr-data
      - /mnt/YOUR_POOL/paperless-local-ai/coordination:/coordination
    mem_limit: 6g
    cpus: 2.0
    shm_size: 2gb

  metadata-worker:
    <<: *core-image
    command: ["python", "/app/worker.py"]
    env_file:
      - /mnt/YOUR_POOL/paperless-local-ai/paperless.env
    volumes: *core-volumes
    mem_limit: 512m
    cpus: 0.5

  prompt-ui:
    <<: *core-image
    command: ["python", "/app/prompt_ui.py"]
    env_file:
      - /mnt/YOUR_POOL/paperless-local-ai/paperless.env
    environment:
      PROMPT_UI_HOST: 0.0.0.0
      PROMPT_UI_PORT: "8080"
    ports:
      - "0.0.0.0:30148:8080"
    volumes: *core-volumes
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  suggestion-bridge:
    <<: *core-image
    command: ["python", "/app/suggestion_bridge.py"]
    env_file:
      - /mnt/YOUR_POOL/paperless-local-ai/paperless.env
    environment:
      SUGGESTION_BRIDGE_HOST: 0.0.0.0
      SUGGESTION_BRIDGE_PORT: "8081"
    ports:
      - "0.0.0.0:30149:8081"
    volumes:
      - /mnt/YOUR_POOL/paperless-local-ai/config:/config:ro
      - /mnt/YOUR_POOL/paperless-local-ai/core:/data:ro
    mem_limit: 128m
    cpus: 0.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
