name: paperless-local-ai

x-portals:
  - name: Control Center
    scheme: http
    host: 0.0.0.0
    port: 30148
    path: /

x-core-image: &core-image
  image: ghcr.io/lucaperl/paperless-local-ai-core:stable
  restart: unless-stopped

x-core-volumes: &core-volumes
  - /mnt/YOUR_POOL/paperless-local-ai/config:/config
  - /mnt/YOUR_POOL/paperless-local-ai/core:/data
  - /mnt/YOUR_POOL/paperless-local-ai/coordination:/coordination

services:
  ocr-service:
    image: ghcr.io/lucaperl/paperless-local-ai-ocr:stable
    restart: unless-stopped
    env_file:
      - /mnt/YOUR_POOL/paperless-local-ai/paperless.env
    environment:
      HOME: /ocr-data
      PADDLE_PDX_CACHE_HOME: /ocr-data/.paddlex
      PADDLE_PDX_CPU_NUM_THREADS: "4"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      OCR_SESSION_IDLE_SECONDS: "5"
      OCR_ENABLE_HPI: "true"
      OCR_SERVICE_HOST: 0.0.0.0
      OCR_SERVICE_PORT: "8082"
      OCR_PAGE_TIMEOUT_SECONDS: "1800"
      OCR_MAX_REQUEST_BYTES: "104857600"
      OCR_TMP_DIR: /dev/shm/paperless-local-ai-ocr
    ports:
      - "0.0.0.0:30150:8082"
    volumes:
      - /mnt/YOUR_POOL/paperless-local-ai/config:/config:ro
      - /mnt/YOUR_POOL/paperless-local-ai/ocr:/ocr-data
      - /mnt/YOUR_POOL/paperless-local-ai/coordination:/coordination
      - /mnt/YOUR_POOL/paperless-local-ai/integration:/integration
    mem_limit: 7g
    cpus: 4.0
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  core-service:
    <<: *core-image
    command: ["python", "/app/core_service.py"]
    env_file:
      - /mnt/YOUR_POOL/paperless-local-ai/paperless.env
    environment:
      PROMPT_UI_HOST: 0.0.0.0
      PROMPT_UI_PORT: "8080"
      SUGGESTION_BRIDGE_HOST: 0.0.0.0
      SUGGESTION_BRIDGE_PORT: "8081"
    ports:
      - "0.0.0.0:30148:8080"
      - "0.0.0.0:30149:8081"
    volumes: *core-volumes
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).read();
          urllib.request.urlopen('http://127.0.0.1:8081/api/version', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
