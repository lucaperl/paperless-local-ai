name: render-mermaid

on:
  push:
    branches:
      - main
    paths:
      - "docs/diagrams/**/*.mmd"
      - ".github/workflows/render-mermaid.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Render workflow diagram
        run: |
          docker run --rm \
            --user 0:0 \
            -v "$PWD:/data" \
            ghcr.io/mermaid-js/mermaid-cli/mermaid-cli:11.16.1 \
            -i docs/diagrams/paperless-flow.mmd \
            -o images/paperless-flow.svg \
            -b transparent

      - name: Commit updated SVG
        run: |
          if [ -z "$(git status --porcelain -- images/paperless-flow.svg)" ]; then
            echo "SVG is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- images/paperless-flow.svg
          git commit -m "docs: render Mermaid workflow"
          git push
