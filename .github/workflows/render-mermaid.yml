name: render-mermaid

on:
  push:
    branches:
      - main
    paths:
      - "docs/diagrams/**/*.mmd"

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out current branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Render SVG from Mermaid
        uses: docker://ghcr.io/mermaid-js/mermaid-cli/mermaid-cli:11.16.1
        with:
          args: -i docs/diagrams/paperless-flow.mmd -o images/paperless-flow.svg -b transparent

      - name: Commit generated SVG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: render Mermaid workflow"
          file_pattern: images/paperless-flow.svg
