name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit and regression tests
        run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate published Compose
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config >/dev/null
      - name: Validate local-build override
        run: docker compose -f compose.yaml -f compose.dev.yaml config >/dev/null
