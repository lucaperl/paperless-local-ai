name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/dev.txt
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit and regression tests
        run: pytest -q

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add --toolchain 1.98.0 rustfmt clippy
          rustup target add --toolchain 1.98.0 x86_64-unknown-linux-musl
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          rustc +1.98.0             --edition=2024             --target x86_64-unknown-linux-musl             -C opt-level=s             -C strip=symbols             -C panic=abort             -C target-feature=+crt-static             -o /tmp/plai-healthcheck-musl             rust/core/src/bin/plai-healthcheck.rs
          file /tmp/plai-healthcheck-musl
          ldd /tmp/plai-healthcheck-musl 2>&1 | grep -Eq 'not a dynamic executable|statically linked'

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate published Compose
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config >/dev/null
      - name: Validate local-build override
        run: docker compose -f compose.yaml -f compose.dev.yaml config >/dev/null
