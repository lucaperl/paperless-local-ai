version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: "/requirements"
    schedule:
      interval: monthly

    groups:
      opencv-ocr:
        patterns:
          - "opencv-contrib-python"

      numpy-ocr:
        patterns:
          - "numpy"
          
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly

    ignore:
      # Unicode 17; keep Python 3.14 / Unicode 16 parity.
      - dependency-name: "unicode-normalization"
        versions: ["0.1.25"]

      # Unicode 17; keep Python 3.14 / Unicode 16 parity.
      - dependency-name: "unicase"
        versions: ["2.9.0"]

      # Breaking API change; requires an explicit code migration.
      - dependency-name: "sha2"
        versions: ["0.11.0"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly

    groups:
      paddlepaddle-ocr:
        patterns:
          - "paddlepaddle/paddle"
