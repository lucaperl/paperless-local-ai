[package]
name = "plai-core"
version = "0.3.5-rc.1"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "plai_core"
path = "src/lib.rs"

[dependencies]
unicase = "=2.8.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "~1.51.0", default-features = false, features = ["rt", "time"] }
unicode-normalization = { version = "=0.1.24", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
